name: pages

# Build the static demos and deploy them to GitHub Pages: the Ethiopic Ledger
# (feature 005) at the site root and the Ethiopian Calendar under /calendar/.
# Both are static consumers of the built @ethiopic-primitives package; it ships
# under examples/ and is not part of the published package surface.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the package
        working-directory: javascript
        run: npm ci --ignore-scripts || npm install --ignore-scripts; npm run build
      - name: Stage the demo libs (copy dist -> examples/*/lib)
        working-directory: javascript
        run: npm run demo:lib
      - name: Run the demo helper tests
        run: node --test examples/ethiopic-ledger/test/*.test.js examples/ethiopic-calendar/test/*.test.js
      - name: Assemble the site (ledger at /, calendar at /calendar/)
        run: |
          mkdir -p _site/calendar
          cp -R examples/ethiopic-ledger/. _site/
          cp -R examples/ethiopic-calendar/. _site/calendar/
      - name: Upload the site as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
